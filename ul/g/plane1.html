<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹幕射击 - 持续升级版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:system-ui}
canvas{display:block;margin:10px auto;background:#000;border:2px solid #444}
#info{text-align:center;margin:8px}
</style>
</head>
<body>
<div id="info">WASD移动｜空格射击｜Q大招｜拾取卡片｜波次越高敌人越肉、刷新越快</div>
<canvas id="game" width="480" height="720"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// 游戏状态
let player = {x:W/2,y:H-80,w:32,h:32,speed:5,hp:5,ultCd:0,ultReady:true};
let bullets = [];
let enemyBullets = [];
let enemies = [];
let wingmen = [];
let cards = [];
let particles = [];
let wave = 1;
let spawnTimer = 0;
let spawnInterval = 1.8;
let enemiesPerWave = 6;
let spawnedThisWave = 0;
let waveDelay = 0;
let boss = null;
let score = 0;
let keys = {};

// 卡片效果
let perks = {
  pierce:false,
  bulletPlus:false,
  fireRate:1,
  damage:1
};

// 输入监听
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyQ' && player.ultReady) doUltimate();
});
document.addEventListener('keyup',e=>keys[e.code]=false);
canvas.onclick = (ev)=>{
  const r = canvas.getBoundingClientRect();
  const mx = ev.clientX - r.left;
  const my = ev.clientY - r.top;
  for(let i=cards.length-1;i>=0;i--){
    const c = cards[i];
    const d = Math.hypot(mx-c.x,my-c.y);
    if(d<22){
      applyCard(c.type);
      cards.splice(i,1);
    }
  }
}

// 玩家射击
let shootTimer = 0;
function shoot(){
  shootTimer += 0.016;
  const fr = 0.2 / perks.fireRate;
  if(shootTimer<fr) return;
  shootTimer=0;
  const b = newBullet(player.x,player.y-20,0,-7,perks.pierce,perks.damage);
  bullets.push(b);
  if(perks.bulletPlus){
    bullets.push(newBullet(player.x-12,player.y-20,-0.1,-7,perks.pierce,perks.damage));
    bullets.push(newBullet(player.x+12,player.y-20,0.1,-7,perks.pierce,perks.damage));
  }
}

function newBullet(x,y,ax,ay,pierce=false,dmg=1){
  return {x,y,vx:ax,vy:ay,pierce,hitSet:new Set(),dmg,life:3};
}

// 僚机初始化
function initWingman(){
  wingmen = [
    {ox:-35,oy:10,shootT:0},
    {ox:35,oy:10,shootT:0}
  ];
}

function wingmanShoot(w){
  w.shootT +=0.016;
  if(w.shootT<0.35) return;
  w.shootT=0;
  const bx = player.x + w.ox;
  const by = player.y + w.oy -15;
  bullets.push(newBullet(bx,by,0,-6,perks.pierce,perks.damage));
}

// 大招
function doUltimate(){
  if(!player.ultReady) return;
  player.ultReady = false;
  player.ultCd = 8;
  // 清小怪，打BOSS
  enemies.forEach(e=>e.hp=0);
  if(boss) boss.hp -= 40;
  // 短暂无敌
  player.inv = 1.2;
}

// 卡片
function applyCard(type){
  switch(type){
    case 'pierce': perks.pierce=true; break;
    case 'bulletPlus': perks.bulletPlus=true; break;
    case 'fireRate': perks.fireRate +=0.3; break;
    case 'damage': perks.damage +=0.4; break;
  }
}
function spawnCard(x,y){
  const types = ['pierce','bulletPlus','fireRate','damage'];
  cards.push({x,y,type:types[Math.floor(Math.random()*types.length)],life:8});
}

// 敌人
function spawnEnemy(){
  const side = Math.random();
  let kind = 0;
  if(side<0.4) kind=0; //普通
  else if(side<0.7) kind=1; //高速
  else kind=2; //射击怪
  const hpScale = Math.pow(1.15, wave-1);
  const baseHp = Math.round(3*hpScale);
  const ex = 40 + Math.random()*(W-80);
  const ey = -20;
  let spd = 1.8;
  let canShoot = false;
  if(kind===1) spd *=2.2;
  if(kind===2) canShoot=true;
  enemies.push({
    x:ex,y:ey,w:28,h:28,hp:baseHp,maxHp:baseHp,speed:spd,canShoot,shootT:0
  });
}

function spawnBoss(){
  boss = {
    x:W/2,y:-60,w:90,h:70,hp:120*wave,maxHp:120*wave,phase:0,shootT:0
  }
}

// 更新BOSS弹幕（修复不动问题，持续移动弹幕）
function bossUpdate(dt){
  if(!boss) return;
  boss.shootT += dt;
  if(boss.shootT>0.4){
    boss.shootT=0;
    const ang = Math.PI*2*Math.random();
    for(let i=0;i<8;i++){
      const a = Math.PI*2/8*i + boss.phase*0.25;
      enemyBullets.push({
        x:boss.x,y:boss.y+30,
        vx:Math.cos(a)*3.2,
        vy:Math.sin(a)*3.2,
        life:5
      })
    }
    boss.phase++;
  }
  if(boss.y<120) boss.y += 1.2;
  if(boss.hp<=0){
    spawnCard(boss.x,boss.y);
    score += 500;
    boss=null;
    wave++;
    spawnInterval *=0.92; //刷新加速
    enemiesPerWave +=2;
    spawnedThisWave=0;
    waveDelay=2.5;
  }
}

// 碰撞检测
function rectHit(a,b,aw,ah,bw,bh){
  return a.x-aw/2 < b.x+bw/2 && a.x+aw/2 > b.x-bw/2 &&
         a.y-ah/2 < b.y+bh/2 && a.y+ah/2 > b.y-bh/2;
}

function update(dt){
  // 玩家移动
  let mx=0,my=0;
  if(keys['KeyA']) mx-=1; if(keys['KeyD']) mx+=1;
  if(keys['KeyW']) my-=1; if(keys['KeyS']) my+=1;
  const len = Math.hypot(mx,my);
  if(len>0){mx/=len;my/=len;}
  player.x += mx*player.speed;
  player.y += my*player.speed;
  player.x = Math.max(16,Math.min(W-16,player.x));
  player.y = Math.max(16,Math.min(H-16,player.y));

  if(keys['Space']) shoot();

  // 大招冷却
  if(player.ultCd>0){
    player.ultCd -= dt;
    if(player.ultCd<=0) player.ultReady=true;
  }
  if(player.inv>0) player.inv-=dt;

  // 僚机
  wingmen.forEach(w=>{
    wingmanShoot(w);
    w.x = player.x + w.ox;
    w.y = player.y + w.oy;
  })

  // 子弹更新
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life -= dt;
    if(b.life<=0 || b.y<-10 || b.y>H+10){bullets.splice(i,1);continue;}
    // 和敌人碰撞
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(rectHit(b,e,8,14,e.w,e.h)){
        if(b.hitSet.has(e)) continue;
        b.hitSet.add(e);
        e.hp -= b.dmg;
        if(e.hp<=0){
          spawnCard(e.x,e.y);
          score +=10;
          enemies.splice(j,1);
        }
        if(!b.pierce){bullets.splice(i,1);break;}
      }
    }
    // BOSS碰撞
    if(boss && rectHit(b,boss,8,14,boss.w,boss.h)){
      if(b.hitSet.has(boss)) continue;
      b.hitSet.add(boss);
      boss.hp -= b.dmg;
      if(!b.pierce){bullets.splice(i,1);break;}
    }
  }

  // 敌人子弹
  for(let i=enemyBullets.length-1;i>=0;i--){
    const eb = enemyBullets[i];
    eb.x += eb.vx; eb.y += eb.vy; eb.life -= dt;
    if(eb.life<=0 || eb.y>H+10 || eb.x<0||eb.x>W){enemyBullets.splice(i,1);continue;}
    if(player.inv<=0 && rectHit(eb,player,10,10,player.w,player.h)){
      player.hp--;
      player.inv=1;
      enemyBullets.splice(i,1);
    }
  }

  // 敌人更新
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const d = Math.hypot(dx,dy);
    if(d>0){e.x += dx/d*e.speed; e.y += dy/d*e.speed;}
    if(e.canShoot){
      e.shootT += dt;
      if(e.shootT>2.2){
        e.shootT=0;
        const a = Math.atan2(dy,dx);
        enemyBullets.push({x:e.x,y:e.y, vx:Math.cos(a)*2.8, vy:Math.sin(a)*2.8, life:4})
      }
    }
    if(e.y>H+40) enemies.splice(i,1);
  }

  bossUpdate(dt);

  // 波次生成
  waveDelay -= dt;
  if(waveDelay<=0){
    spawnTimer += dt;
    if(spawnTimer>spawnInterval && spawnedThisWave < enemiesPerWave){
      spawnTimer=0;
      spawnEnemy();
      spawnedThisWave++;
    }
    if(spawnedThisWave >= enemiesPerWave && !boss && enemies.length===0){
      if(wave%5===0){
        spawnBoss();
      }else{
        wave++;
        spawnInterval *=0.92;
        enemiesPerWave +=2;
        spawnedThisWave=0;
        waveDelay=2;
      }
    }
  }

  // 卡片超时
  for(let i=cards.length-1;i>=0;i--){
    cards[i].life -= dt;
    if(cards[i].life<=0) cards.splice(i,1);
  }
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);
  // 玩家
  ctx.fillStyle="#4af";
  ctx.beginPath();
  ctx.moveTo(player.x,player.y-16);
  ctx.lineTo(player.x-14,player.y+14);
  ctx.lineTo(player.x+14,player.y+14);
  ctx.fill();
  // 僚机
  ctx.fillStyle="#8cf";
  wingmen.forEach(w=>{
    ctx.beginPath();
    ctx.arc(player.x+w.ox,player.y+w.oy,10,0,Math.PI*2);
    ctx.fill();
  })
  // 子弹
  ctx.fillStyle="#fff";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-3,b.y-7,6,14);
  })
  //敌人子弹
  ctx.fillStyle="#f66";
  enemyBullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
  })
  //敌人
  ctx.fillStyle="#f44";
  enemies.forEach(e=>{
    ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);
    //血条
    ctx.fillStyle="#333";
    ctx.fillRect(e.x-14,e.y-e.h/2-6,28,3);
    ctx.fillStyle="#0f0";
    ctx.fillRect(e.x-14,e.y-e.h/2-6,28*(e.hp/e.maxHp),3);
    ctx.fillStyle="#f44";
  })
  //BOSS
  if(boss){
    ctx.fillStyle="#f22";
    ctx.fillRect(boss.x-boss.w/2,boss.y-boss.h/2,boss.w,boss.h);
    ctx.fillStyle="#333";
    ctx.fillRect(boss.x-45,boss.y-boss.h/2-10,90,6);
    ctx.fillStyle="#f00";
    ctx.fillRect(boss.x-45,boss.y-boss.h/2-10,90*(boss.hp/boss.maxHp),6);
  }
  //卡片
  cards.forEach(c=>{
    ctx.fillStyle="#ff0";
    ctx.beginPath();
    ctx.arc(c.x,c.y,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#000";
    ctx.font="12px sans-serif";
    ctx.textAlign="center";
    ctx.fillText(c.type,c.x,c.y+4);
  })
  // UI
  ctx.fillStyle="#fff";
  ctx.font="16px sans-serif";
  ctx.textAlign="left";
  ctx.fillText(`波次:${wave} 分数:${score} HP:${player.hp}`,8,20);
  ctx.fillText(`大招:${player.ultReady?"就绪":"冷却"}`,8,40);
}

let last = 0;
function loop(t){
  const dt = Math.min((t-last)/1000,0.05);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initWingman();
requestAnimationFrame(loop);
</script>
</body>
</html>
