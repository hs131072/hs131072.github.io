canvas{display:block}

#xh{position:absolute;left:50%;top:50%;width:0;height:0}

#ammo .mag{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
#ammo .res{font-size:18px;opacity:.6;margin-left:6px}
#ammo .wpn{font-size:11px;letter-spacing:3px;opacity:.7;margin-top:4px}
#top{position:absolute;top:24px;left:50%;transform:translateX(-50%);text-align:center;font-size:12px;letter-spacing:4px}
#top b{display:block;font-size:22px;font-weight:300;letter-spacing:2px;margin-top:3px}

#score b{display:block;font-size:24px;font-weight:300;letter-spacing:1px}
#msg{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:8px;opacity:0;transition:opacity .4s;text-shadow:0 0 12px rgba(0,0,0,.8)}

#menu.off{opacity:0;pointer-events:none}

#menu h1{font-weight:200;font-size:64px;letter-spacing:14px;margin:0;line-height:1}
#menu h2{font-weight:400;font-size:12px;letter-spacing:6px;opacity:.7;margin:10px 0 28px}
#menu p{font-size:13px;line-height:1.9;opacity:.8;margin:0}

#dmgdir{position:absolute;left:50%;top:50%;width:300px;height:300px;opacity:0;pointer-events:none}
