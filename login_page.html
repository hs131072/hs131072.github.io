<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc · 登录 / 注册</title>
<script src="assets/db.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#020617;font-family:'Inter',system-ui,'Microsoft YaHei',sans-serif;overflow:hidden;}
  .bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 30%,#1e1b4b 0%,#0f172a 60%,#020617 100%);}
  .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.5;z-index:-1;}
  .o1{width:55vw;height:55vw;background:conic-gradient(#3b82f6,#8b5cf6,#ec4899,#3b82f6);top:-25%;left:-15%;}
  .o2{width:45vw;height:45vw;background:conic-gradient(#06b6d4,#3b82f6,#6366f1,#06b6d4);bottom:-20%;right:-12%;}
  .card{width:100%;max-width:420px;margin:16px;padding:2.6rem 2.4rem;border-radius:32px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(40px) saturate(180%);box-shadow:0 40px 80px -20px rgba(0,0,0,.5);}
  .title{font-size:2.6rem;font-weight:900;letter-spacing:-.03em;text-align:center;
    background:linear-gradient(135deg,#fff,#cbd5e1,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{text-align:center;color:#94a3b8;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;margin:.4rem 0 1.8rem;}
  .tabs{display:flex;background:rgba(255,255,255,.04);border-radius:16px;padding:4px;margin-bottom:1.6rem}
  .tab{flex:1;text-align:center;padding:.6rem 0;border-radius:12px;color:#94a3b8;cursor:pointer;font-weight:600;font-size:.95rem;transition:.25s}
  .tab.active{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(129,140,248,.25));color:#fff;}
  .field{margin-bottom:1.1rem}
  .field label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:.4rem;letter-spacing:.05em}
  .field .input-wrap{position:relative;display:flex;align-items:center}
  .field i{position:absolute;left:14px;color:#64748b}
  .field input{width:100%;padding:.85rem 1rem .85rem 2.6rem;border-radius:14px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);color:#fff;font-size:1rem;outline:none;transition:.25s}
  .field input:focus{border-color:rgba(56,189,248,.5);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  .btn{width:100%;margin-top:.6rem;cursor:pointer;border:1px solid rgba(103,232,249,.4);
    background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(129,140,248,.2));color:#fff;font-weight:700;font-size:1rem;
    padding:.95rem;border-radius:16px;transition:.25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(56,189,248,.5)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .msg{min-height:1.3rem;text-align:center;font-size:.85rem;margin-top:.9rem}
  .err{color:#f87171}.ok{color:#34d399}
  .links{display:flex;justify-content:space-between;margin-top:1.2rem;font-size:.82rem}
  .links a{color:#94a3b8;text-decoration:none}
  .links a:hover{color:#fff}
  .hidden{display:none}
  .guest{display:block;text-align:center;margin-top:1rem;color:#64748b;font-size:.85rem}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb o1"></div><div class="orb o2"></div>

<div class="card">
  <h1 class="title">Arc</h1>
  <p class="sub">Account Access</p>

  <div id="loggedView" class="hidden">
    <p class="msg ok" id="welcomeText"></p>
    <button class="btn" id="btnEnter">进入大厅</button>
    <button class="btn ghost" id="btnLogout" style="margin-top:.8rem;border-color:rgba(148,163,184,.3);background:rgba(255,255,255,.04)">退出登录</button>
  </div>

  <div id="formView">
    <div class="tabs">
      <div class="tab active" data-mode="login">登录</div>
      <div class="tab" data-mode="register">注册</div>
    </div>
    <form id="form" autocomplete="off">
      <div class="field">
        <label>用户名</label>
        <div class="input-wrap"><i class="fa-solid fa-user"></i>
          <input id="username" type="text" placeholder="3-20 位字母 / 数字 / 中文" maxlength="20">
        </div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i>
          <input id="password" type="password" placeholder="至少 4 位密码" maxlength="40">
        </div>
      </div>
      <div class="field hidden" id="confirmField">
        <label>确认密码</label>
        <div class="input-wrap"><i class="fa-solid fa-shield-halved"></i>
          <input id="confirm" type="password" placeholder="再次输入密码" maxlength="40">
        </div>
      </div>
      <button class="btn" id="submitBtn" type="submit">登录</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="links">
      <a href="index.html">← 返回首页</a>
      <a href="unlogin_menu.html">游客进入 →</a>
    </div>
  </div>
</div>

<script>
const mode={current:'login'};
const tabs=document.querySelectorAll('.tab');
const form=document.getElementById('form');
const msg=document.getElementById('msg');
const confirmField=document.getElementById('confirmField');
const submitBtn=document.getElementById('submitBtn');

tabs.forEach(t=>t.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  mode.current=t.dataset.mode;
  confirmField.classList.toggle('hidden',mode.current!=='register');
  submitBtn.textContent=mode.current==='register'?'注册并进入':'登录';
  msg.className='msg'; msg.textContent='';
}));

function setMsg(text,type){ msg.className='msg '+(type||''); msg.textContent=text; }

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  setMsg('');
  submitBtn.disabled=true; submitBtn.textContent='请稍候…';
  try{
    if(mode.current==='register'){
      if(password!==confirm) throw new Error('两次输入的密码不一致');
      await ARC_DB.register(username,password);
    }else{
      await ARC_DB.login(username,password);
    }
    setMsg('成功，正在进入大厅…','ok');
    setTimeout(()=>location.href='unlogin_menu.html',600);
  }catch(err){
    setMsg(err.message||'操作失败，请重试','err');
    submitBtn.disabled=false; submitBtn.textContent=mode.current==='register'?'注册并进入':'登录';
  }
});

/* 已登录状态 */
function refreshSession(){
  const s=ARC_DB.getSession();
  if(s){
    document.getElementById('formView').classList.add('hidden');
    document.getElementById('loggedView').classList.remove('hidden');
    document.getElementById('welcomeText').textContent='欢迎回来，'+s.nickname+'！';
  }
}
document.getElementById('btnEnter').onclick=()=>location.href='unlogin_menu.html';
document.getElementById('btnLogout').onclick=()=>{ ARC_DB.logout(); location.reload(); };
refreshSession();
</script>
</body>
</html>
