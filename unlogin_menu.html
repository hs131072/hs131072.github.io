<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc - 探索未来</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --mouse-x: 50%; --mouse-y: 50%; }
body { margin:0; padding:0; overflow-x:hidden; background:#020617; font-family:'Inter',sans-serif; cursor:none; }

/* 背景层 */
.ambient-bg { position:absolute; top:0; left:0; width:100%; height:100%; z-index:-3; background:radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%); }
.noise-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"); pointer-events:none; z-index:-1; opacity:0.4; }

/* 流体光球 */
.orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:0.6; animation:fluid-move 15s infinite ease-in-out alternate; }
.orb-1 { width:60vw; height:60vw; background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#ec4899,#3b82f6); top:-30%; left:-20%; animation-duration:20s; }
.orb-2 { width:50vw; height:50vw; background:conic-gradient(from 180deg,#06b6d4,#3b82f6,#6366f1,#06b6d4); bottom:-20%; right:-15%; animation-duration:25s; animation-delay:-5s; }
.orb-3 { width:30vw; height:30vw; background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%); top:40%; left:40%; animation:pulse-glow 8s infinite ease-in-out; }
@keyframes fluid-move { 0%{transform:translate(0,0) rotate(0deg) scale(1)} 100%{transform:translate(50px,30px) rotate(20deg) scale(1.1)} }
@keyframes pulse-glow { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.6;transform:scale(1.2)} }

/* 增强型自定义光标 */
.cursor-wrapper { position:fixed; top:0; left:0; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:opacity 0.2s, transform 0.1s; }
.cursor-dot { width:6px; height:6px; background:#fff; border-radius:50%; box-shadow:0 0 15px rgba(255,255,255,0.8); }
.cursor-ring { position:absolute; top:50%; left:50%; width:40px; height:40px; border:1px solid rgba(255,255,255,0.3); border-radius:50%; transform:translate(-50%,-50%); transition:all 0.15s ease-out; }
.cursor-glow { position:absolute; top:50%; left:50%; width:400px; height:400px; background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 50%); transform:translate(-50%,-50%); mix-blend-mode:screen; }

/* ========== 顶部导航栏（开启3D透视） ========== */
.nav-bar {
    position:fixed;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    z-index:120;
    padding:14px 32px;
    border-radius:999px;
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(36px) saturate(180%);
    -webkit-backdrop-filter:blur(36px) saturate(180%);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 24px 60px -12px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    display:flex;
    gap:36px;
    align-items:center;
    perspective:1400px;
}
.nav-item {
    position:relative;
    color:#cbd5e1;
    text-decoration:none;
    font-size:0.95rem;
    letter-spacing:0.08em;
    padding:6px 4px;
    transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    transform-style:preserve-3d;
    cursor:pointer;
}
.nav-item:hover {
    color:#ffffff;
    text-shadow:0 0 16px rgba(255,255,255,0.35);
    transform:translateY(-4px) rotateX(8deg) scale(1.04);
}
.nav-item.active {
    color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,0.45);
}
.nav-item::after {
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0;
    height:1px;
    background:linear-gradient(90deg,#fff,rgba(255,255,255,0));
    transition:width 0.4s ease;
}
.nav-item:hover::after { width:100%; }
.nav-item.active::after { width:100%; }

/* ========== 全屏面板【铺满整个屏幕】 ========== */
.full-panel {
    position:fixed;
    inset:0;
    z-index:110;
    background:rgba(2,6,23,0.78);
    backdrop-filter:blur(42px);
    -webkit-backdrop-filter:blur(42px);
    opacity:0;
    pointer-events:none;
    perspective:1600px;
    transform-style:preserve-3d;
    transition:opacity 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
.full-panel.active {
    opacity:1;
    pointer-events:auto;
}
.panel-inner {
    width:100%;
    height:100%;
    box-sizing:border-box;
    padding:120px 40px 40px;
    overflow-y:auto;
    transform-origin:center center;
    transform:rotateY(12deg) scale(0.85);
    transition:transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
    transform-style:preserve-3d;
}
.full-panel.active .panel-inner {
    transform:rotateY(0deg) scale(1);
}
.panel-close {
    position:absolute;
    top:24px;
    right:24px;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.02);
    color:#cbd5e1;
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:0.3s;
    transform-style:preserve-3d;
}
.panel-close:hover {
    background:rgba(255,255,255,0.08);
    color:#fff;
    transform:rotateY(90deg);
}
.panel-title {
    font-size:2.4rem;
    font-weight:800;
    color:#fff;
    letter-spacing:-0.02em;
    margin-bottom:2rem;
    transform-style:preserve-3d;
}
.tile-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:28px;
    max-width:1400px;
    margin:0 auto;
}
/* 通用磁贴 */
.tile {
    position:relative;
    padding:32px 20px;
    border-radius:24px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    text-decoration:none;
    color:#e2e8f0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    transition:all 0.4s cubic-bezier(0.23,1,0.32,1);
    overflow:hidden;
    transform-style:preserve-3d;
}
.tile .tile-shine {
    position:absolute;
    top:0; left:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
    transform:skewX(-20deg);
}
.tile i { font-size:2.2rem; color:#94a3b8; transition:0.3s; }
.tile:hover {
    border-color:rgba(255,255,255,0.22);
    transform:translateY(-10px) rotateX(8deg) rotateY(-4deg);
    box-shadow:0 28px 60px -12px rgba(99,102,241,0.28);
}
.tile:hover i { color:#fff; filter:drop-shadow(0 0 14px rgba(255,255,255,0.35)); }
.tile:hover .tile-shine { left:150%; transition:left 0.7s ease-in-out; }

/* 成员单行磁贴 */
.member-tile {
    padding:24px 28px;
    flex-direction:row;
    justify-content:space-between;
}
.member-tile span { font-size:1.1rem; letter-spacing:0.05em; }

/* 极致玻璃卡片 */
.glass-container {
    position:relative;
    width:100%;
    max-width:650px;
    padding:4rem 3.5rem;
    border-radius:40px;
    background:rgba(255,255,255,0.02);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 40px 80px -20px rgba(0,0,0,0.5),inset 0 0 0 1px rgba(255,255,255,0.05),inset 0 0 60px rgba(255,255,255,0.02);
    transform-style:preserve-3d;
    transition:transform 0.1s ease-out;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3rem;
    overflow:hidden;
}
.glass-reflection {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background:radial-gradient(circle at var(--mouse-x) var(--mouse-y),rgba(255,255,255,0.1) 0%,transparent 40%),linear-gradient(125deg,rgba(255,255,255,0.05) 0%,transparent 40%,rgba(255,255,255,0.02) 100%);
    pointer-events:none; z-index:1;
}
.glass-border-glow {
    position:absolute;
    top:-2px; left:-2px; right:-2px; bottom:-2px;
    background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,0.1) 50%,transparent 60%);
    border-radius:42px; z-index:-1; opacity:0; transition:opacity 0.5s;
}
.glass-container:hover .glass-border-glow { opacity:1; }

/* 全息光泽标题 */
.arc-title {
    font-size:5rem; font-weight:900; letter-spacing:-0.05em;
    background:linear-gradient(135deg,#fff 0%,#cbd5e1 50%,#94a3b8 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    position:relative; z-index:10;
    transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    filter:drop-shadow(0 0 20px rgba(255,255,255,0.1));
    transform-style:preserve-3d;
}
.arc-title:hover { transform:scale(1.05) translateY(-5px) rotateX(6deg); filter:drop-shadow(0 0 40px rgba(255,255,255,0.3)); }
.arc-title::before {
    content:'Arc'; position:absolute; top:0; left:0;
    width:100%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent);
    background-size:200% 100%; background-position:-100% 0;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    opacity:0; transition:opacity 0.3s;
}
.arc-title:hover::before { animation:shine-sweep 1.5s infinite linear; opacity:0.6; }
@keyframes shine-sweep { 0%{background-position:-100% 0} 100%{background-position:200% 0} }
.arc-subtitle {
    color:#94a3b8; font-size:1.1rem; font-weight:400; letter-spacing:0.2em; text-transform:uppercase;
    position:relative; z-index:10;
}
.arc-subtitle::after {
    content:''; display:block; width:40px; height:1px; background:rgba(255,255,255,0.2);
    margin:1rem auto 0; transition:width 0.5s;
}
.glass-container:hover .arc-subtitle::after { width:80px; background:rgba(255,255,255,0.5); }

/* 液态光效磁吸按钮 */
.btn-group { display:flex; gap:2rem; width:100%; justify-content:center; perspective:1000px; }
.liquid-btn {
    position:relative; padding:1.2rem 2.5rem; border-radius:20px;
    font-weight:600; color:#fff; text-decoration:none;
    border:1px solid rgba(255,255,255,0.1); min-width:180px;
    display:flex; align-items:center; justify-content:center; gap:0.8rem;
    transition:all 0.5s cubic-bezier(0.23,1,0.32,1);
    overflow:hidden; background:rgba(255,255,255,0.03);
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.2);
    transform-style:preserve-3d;
}
.btn-primary { background:linear-gradient(135deg,rgba(255,255,255,0.1) 0%,rgba(255,255,255,0.05) 100%); }
.btn-primary:hover { border-color:rgba(255,255,255,0.3); box-shadow:0 20px 40px -10px rgba(56,189,248,0.4); transform:translateY(-5px) rotateX(6deg); }
.btn-secondary:hover { border-color:rgba(255,255,255,0.2); box-shadow:0 20px 40px -10px rgba(232,121,249,0.2); transform:translateY(-5px) rotateX(6deg); }
.btn-shine {
    position:absolute; top:0; left:-100%; width:50%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
    transform:skewX(-20deg); transition:left 0.5s;
}
.liquid-btn:hover .btn-shine { left:150%; transition:left 0.7s ease-in-out; }
.btn-glow {
    position:absolute; width:100%; height:100%; top:0; left:0;
    background:radial-gradient(circle at var(--mouse-x) var(--mouse-y),rgba(255,255,255,0.15) 0%,transparent 60%);
    opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.liquid-btn:hover .btn-glow { opacity:1; }

/* 点击粒子特效 */
.click-particle {
    position:fixed; width:4px; height:4px; background:#fff; border-radius:50%;
    pointer-events:none; z-index:9998; box-shadow:0 0 10px #fff;
}
@keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

/* 移动端处理 */
@media (max-width:768px) {
    body { cursor:auto; }
    .cursor-wrapper { display:none !important; }
    .nav-bar {
        top:12px;
        gap:14px;
        padding:12px 16px;
        border-radius:24px;
        max-width:94vw;
        flex-wrap:wrap;
        justify-content:center;
    }
    .nav-item { font-size:0.78rem; }
    .panel-inner { padding:100px 20px 30px; }
    .panel-title { font-size:1.6rem; }
    .arc-title { font-size:3rem; }
    .glass-container { padding:2.5rem 1.8rem; }
    .btn-group { flex-direction:column; align-items:center; gap:1rem; }
}
</style>
</head>
<body>
<div class="ambient-bg">
<div class="orb orb-1"></div>

</div>

<!-- 增强型自定义光标 -->
<div class="cursor-wrapper" id="cursorWrapper">

<div class="cursor-ring"></div>
<div class="cursor-glow"></div>
</div>

<!-- 顶部导航 -->
<nav class="nav-bar">
    <span class="nav-item" data-panel="home">主页</span>

<!-- 全屏面板 - 工具 -->

<!-- 全屏面板 - 其他（成员名单） -->

<!-- 全屏面板 - 我的 -->
<div class="full-panel" id="panel-mine">

        <h2 class="panel-title">我的</h2>

<main class="flex items-center justify-center min-h-screen p-4 pt-28">

System Online // v4.0 Enhanced

<script>
const cursorWrapper = document.getElementById('cursorWrapper');
const cursorRing = document.querySelector('.cursor-ring');
const glassCard = document.getElementById('glassCard');
const buttons = document.querySelectorAll('.liquid-btn');
const arcTitle = document.getElementById('arcTitle');

// 面板控制
const navItems = document.querySelectorAll('.nav-item');
const panels = document.querySelectorAll('.full-panel');
const closeBtns = document.querySelectorAll('.panel-close');

// 默认激活主页
const defaultPanel = "home";
document.getElementById('panel-'+defaultPanel).classList.add('active');
navItems.forEach(item=>{
    if(item.dataset.panel === defaultPanel) item.classList.add('active');
})

navItems.forEach(item=>{
    item.addEventListener('click',()=>{
        const pid = item.dataset.panel;
        // 清除所有激活
        panels.forEach(p=>p.classList.remove('active'));
        navItems.forEach(ni=>ni.classList.remove('active'));
        // 激活当前
        document.getElementById('panel-'+pid).classList.add('active');
        item.classList.add('active');
    })
})
closeBtns.forEach(btn=>{
    btn.addEventListener('click',()=>{
        const pid = btn.dataset.close;
        document.getElementById('panel-'+pid).classList.remove('active');
        navItems.forEach(ni=>{
            if(ni.dataset.panel === pid) ni.classList.remove('active');
        })
    })
})
// 点击面板背景关闭
panels.forEach(panel=>{
    panel.addEventListener('click',(e)=>{
        if(e.target === panel) {
            panel.classList.remove('active');
            const pid = panel.id.replace('panel-','');
            navItems.forEach(ni=>{
                if(ni.dataset.panel === pid) ni.classList.remove('active');
            })
        }
    })
})

// 鼠标移动全量交互逻辑
document.addEventListener('mousemove', (e) => {
    const x = e.clientX, y = e.clientY;
    
    // 光标主体跟随
    cursorWrapper.style.left = x + 'px';
    cursorWrapper.style.top = y + 'px';
    
    // 外环延迟缩放
    setTimeout(() => { cursorRing.style.transform = 'translate(-50%,-50%) scale(1.2)'; }, 50);
    
    // 更新全局鼠标坐标变量
    document.documentElement.style.setProperty('--mouse-x', x + 'px');
    document.documentElement.style.setProperty('--mouse-y', y + 'px');
    
    // 按钮内部光效定位
    buttons.forEach(btn => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty('--mouse-x', ((x - r.left) / r.width * 100) + '%');
        btn.style.setProperty('--mouse-y', ((y - r.top) / r.height * 100) + '%');
    });

    // 所有磁贴磁吸光效
    document.querySelectorAll('.tile').forEach(tile=>{
        const r = tile.getBoundingClientRect();
        tile.style.setProperty('--mouse-x', ((x - r.left) / r.width * 100) + '%');
        tile.style.setProperty('--mouse-y', ((y - r.top) / r.height * 100) + '%');
    });
    
    // 玻璃卡片3D倾斜
    if (glassCard) {
        const r = glassCard.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const ry = ((x - cx) / (window.innerWidth / 2)) * 10;
        const rx = -((y - cy) / (window.innerHeight / 2)) * 10;
        glassCard.style.transform = 'perspective(1000px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    }
    
    // 标题视差偏移
    if (arcTitle) {
        const r = glassCard.getBoundingClientRect();
        const tx = (x - r.left - r.width / 2) / 25;
        const ty = (y - r.top - r.height / 2) / 25;
        arcTitle.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
    }
});

// 鼠标离开恢复光标环
document.addEventListener('mouseleave',()=>{
    cursorRing.style.transform = 'translate(-50%,-50%) scale(1)';
});

// 点击光标缩放+粒子爆发
document.addEventListener('mousedown', (e) => {
    cursorWrapper.style.opacity = '0';
    cursorRing.style.transform = 'translate(-50%,-50%) scale(0.8)';
    createClickParticles(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
    cursorWrapper.style.opacity = '1';
    cursorRing.style.transform = 'translate(-50%,-50%) scale(1)';
});

// 按钮磁吸效果
buttons.forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
        const r = btn.getBoundingClientRect();
        const x = e.clientX - r.left - r.width / 2;
        const y = e.clientY - r.top - r.height / 2;
        btn.style.transform = 'translate(' + (x * 0.15) + 'px,' + (y * 0.15) + 'px) translateY(-5px) rotateX(6deg)';
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = 'translate(0,0)'; });
});
// 所有磁贴磁吸
document.querySelectorAll('.tile').forEach(tile=>{
    tile.addEventListener('mousemove',(e)=>{
        const r = tile.getBoundingClientRect();
        const x = e.clientX - r.left - r.width/2;
        const y = e.clientY - r.top - r.height/2;
        tile.style.transform = 'translate('+(x*0.12)+'px,'+(y*0.12)+'px) translateY(-10px) rotateX(8deg) rotateY(-4deg)';
    })
    tile.addEventListener('mouseleave',()=>{
        tile.style.transform = 'translate(0,0)';
    })
})

// 点击粒子生成函数
function createClickParticles(x, y) {
    for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.classList.add('click-particle');
        document.body.appendChild(p);
        const a = (Math.PI * 2 * i) / 12;
        const v = 60 + Math.random() * 40;
        const tx = Math.cos(a) * v, ty = Math.sin(a) * v;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.transition = 'all 0.8s cubic-bezier(0,.9,.57,1)';
        setTimeout(() => { p.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(0)'; p.style.opacity = '0'; }, 10);
        setTimeout(() => p.remove(), 800);
    }
}

// 按钮点击涟漪特效
buttons.forEach(btn => {
    btn.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        ripple.style.cssText = 'position:absolute;background:rgba(255,255,255,0.4);border-radius:50%;pointer-events:none;transform:scale(0);animation:ripple-anim 0.8s linear;';
        const r = this.getBoundingClientRect();
        const s = Math.max(r.width, r.height);
        ripple.style.width = ripple.style.height = s + 'px';
        ripple.style.left = (e.clientX - r.left - s / 2) + 'px';
        ripple.style.top = (e.clientY - r.top - s / 2) + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 800);
    });
});
</script>
